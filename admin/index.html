function forget(){ S.tok = ''; S.name = ''; S.data = {}; S.dirty = {}; try { sessionStorage.removeItem('dl_admin_tok'); } catch(e){} S.view = 'pass'; if (S.mode === 'acct') S.step = 'login'; }

async function refreshMe(){
  if (!S.tok){ S.view = 'pass'; return draw(); }
  const r = await rpc('dl_admin_me', { p_token:S.tok });
  if (!r.ok && r.error !== 'auth'){ say(errText(r), true); return draw(); }
  if (S.mode === 'acct' && r.ok && !(r.admin && r.unlocked)){            // 15.86: signed in, next step of the account door
    const was = S.view === 'app';
    S.name = r.username || ''; S.view = 'pass'; S.step = !r.admin ? 'notadmin' : r.has_code ? 'code' : 'setcode';
    draw(); if (was) say(ERR.not_admin, true); return;
  }
  if (!r.ok || !r.admin || !r.unlocked){ const was = S.view === 'app'; forget(); if (S.mode === 'acct') S.step = 'login'; draw(); if (was) say(ERR.not_admin, true); return; }

  if (!/^[A-Za-z0-9_-]{16,64}$/.test(d)){ const a = new Uint8Array(18); crypto.getRandomValues(a); d = Array.from(a, b=> 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_'[b & 63]).join(''); try { localStorage.setItem('dl_admin_dev', d); } catch(e){} }

  const coinRow = h('div', { cls:'row' }, h('div', { cls:'grow' }, coins), ...[1000, 5000, 25000, 100000].map(n=> h('button', { cls:'sm', text:num(n), on:{ click:()=>{ coins.value = n; } } })));
  const itemRow = h('div', { cls:'grow' }, item);

  return h('div', null, h('div', { cls:'phead' }, h('div', null, h('h1', { text:'Give' }), h('p', { text:'Give Dusk Coins, bikes and Store items to a player, or to everyone. They get it the next time they play signed in.' }))),
    h('div', { cls:'card' }, h('h3', { text:'Who', style:'margin-top:0' }), dl, h('div', { cls:'row' }, h('div', { cls:'grow' }, who), h('label', { cls:'row', style:'gap:6px; margin:0' }, all, h('span', { text:'Everyone' }))),
      h('h3', { text:'What' }), h('div', { cls:'row' }, h('div', { cls:'grow' }, kind), itemRow), coinRow,
      h('h3', { text:'Note' }), note,

}
function tabWords(){
  const D = S.data, w = h('input', { type:'text', maxlength:24, placeholder:'a word', autocomplete:'off' }), kind = h('select');
  [['word', 'Only as a whole word'], ['sub', 'Also inside other words'], ['any', 'Anywhere, even spelled with spaces']].forEach(k=> kind.appendChild(h('option', { value:k[0], text:k[1] })));

  const test = async ()=>{ const r = await call('word_test', { text:t.value }); out.textContent = r.ok ? (r.bad ? 'blocked' : 'allowed') : '?'; out.className = 'tag ' + (r.ok ? (r.bad ? 'bad' : 'ok') : ''); };

  return h('div', null, h('h2', { text:'Blocked words' }),
    h('p', { cls:'dim', text:'Names, bios, crew names, server names and event titles with one of these words are refused. The list is hidden from players.' }),
    h('div', { cls:'card' }, h('h3', { text:'Test a name', style:'margin-top:0' }), h('div', { cls:'row' }, h('div', { cls:'grow' }, t), h('button', { text:'Test', on:{ click:test } }), out)),
    h('div', { cls:'card' }, h('h3', { text:'Add a word', style:'margin-top:0' }), h('div', { cls:'row' }, h('div', { cls:'grow' }, w), h('div', { cls:'grow' }, kind),
      h('button', { cls:'pri', text:'Block it', on:{ click:()=>{ if (w.value.trim().length < 2){ say('Type the word first.', true); return; } act('word_set', { word:w.value.trim(), kind:kind.value, on:true }, 'Word blocked.'); } } }))),
    h('div', { cls:'row' }, h('button', { cls:'sm', text:show ? 'Hide the words' : 'Show the words', on:{ click:()=>{ D.showWords = !show; draw(); } } }), h('span', { cls:'dim small', text:(D.words || []).length + ' words. Tap one to switch it off or on.' })),

}
function tabReports(){
  const D = S.data, list = h('div', { cls:'list' });
  if (D.repOff) return h('div', null, h('h2', { text:'Reports' }),
    h('div', { cls:'note', text:'Reports are not switched on yet. A parent needs to run the 15.64 database step (010_fair_safe.sql). Then riders can report each other in the game, and the reports show up here.' }));
  const sel = h('select', { on:{ change:e=>{ D.rst = e.target.value; D.lim_reports = 0; load('reports'); } } });
  [['open', 'Open'], ['done', 'Done'], ['dismissed', 'Not a problem'], ['all', 'All']].forEach(o=> sel.appendChild(h('option', { value:o[0], text:o[1], selected:(D.rst || 'open') === o[0] })));
  (D.reports || []).forEach(r=>{
    const hd = h('div', { cls:'hd' }, h('b', { text:r.name }), r.banned ? h('span', { cls:'tag bad', text:'banned' }) : null,
      h('span', { cls:'tag' + (r.reason === 'cheat' || r.reason === 'mean' ? ' hot' : ''), text:REASONS[r.reason] || r.reason }),
      r.status !== 'open' ? h('span', { cls:'tag ' + (r.status === 'done' ? 'ok' : ''), text:r.status === 'done' ? 'done' : 'not a problem' }) : null,

    const it = h('div', { cls:'item' }, hd, r.note ? h('div', { cls:'meta', text:'“' + r.note + '”' }) : null, h('div', { cls:'meta', text:bits.join(' · ') }));
    const A = h('div', { cls:'acts' });
    if (r.status === 'open'){
      A.appendChild(h('button', { cls:'sm pri', text:'Done', title:'You dealt with it', on:{ click:()=> act('report_set', { id:r.id, set:'done' }, 'Marked done.') } }));
      A.appendChild(h('button', { cls:'sm', text:'Not a problem', on:{ click:()=> act('report_set', { id:r.id, set:'dismissed' }, 'Marked: not a problem.') } }));

    A.appendChild(h('button', { cls:'sm', text:'Find ' + r.name, on:{ click:()=> leaveOk(()=>{ D.q = r.name; D.lim_players = 0; S.tab = 'players'; draw(); load('players'); }) } }));
    it.appendChild(A); list.appendChild(it);

    h('div', { cls:'row' }, h('label', { text:'Show', style:'margin:0' }), sel, h('span', { cls:'dim small', text:(D.repOpen || 0) + ' open' })),
    (D.reports || []).length ? list : h('p', { cls:'dim', text:'Nothing here.' }),
    moreRow((D.reports || []).length, 'reports', 'reports'));

function tabLog(){
  const D = S.data, tb = h('tbody'), q = h('input', { type:'search', placeholder:'Filter: an admin, an action, a player…', value:D.lq || '', maxlength:40 }), cnt = h('span', { cls:'dim small' });
  const rows = (D.log || []).map(l=>{ let d = ''; try { d = l.detail && Object.keys(l.detail).length ? JSON.stringify(l.detail) : ''; } catch(e){}
    return { l, d, txt:[l.admin, l.action, l.target, d].join(' ').toLowerCase() }; });
  const fill = ()=>{
    tb.textContent = ''; const f = (D.lq || '').trim().toLowerCase(); let n = 0;
    rows.forEach(r=>{ if (f && r.txt.indexOf(f) < 0) return; n++;
      tb.appendChild(h('tr', null, h('td', { cls:'dim small', text:when(r.l.at) }), h('td', { text:r.l.admin || '' }), h('td', { text:r.l.action }), h('td', { text:r.l.target || '' }), h('td', { cls:'dim small', text:r.d }))); });
    cnt.textContent = f ? n + ' of ' + rows.length + ' match' : '';

function goTab(t){ if (t === S.tab) return; leaveOk(()=>{ say(''); S.tab = t; if (t === 'ads' || t === 'numbers') S.data.config = null; if (t !== 'map') lmStop(); draw(); load(t); }); }
function draw(){
  const app = $('app'); app.textContent = '';
  if (S.view !== 'app'){
    lmStop();
    const top = h('div', { cls:'top' }, h('div', { cls:'logo' }, 'DUSK', h('b', { text:'LINE' })), h('span', { cls:'tag hot', text:'admin' }), h('span', { cls:'dim small', text:'game ' + GAME_VER }));
    app.appendChild(top);
    const wrap = h('div', { cls:'wrap' });
    wrap.appendChild(h('div', { id:'msg', cls:'msg' + (S.bad ? ' bad' : '') + (S.msg ? '' : ' hide'), role:'status', text:S.msg }));
    wrap.appendChild(viewPass()); app.appendChild(wrap); return;
  }
  const side = h('nav', { cls:'side', 'aria-label':'Admin sections' },
    h('div', { cls:'brand' }, h('div', { cls:'mk', text:'D' }), h('div', null, h('b', { text:'DUSK LINE' }), h('span', { text:'admin · game ' + GAME_VER }))));
  const D = S.data, onl = (D.allPlayers || []).filter(isOnline).length;
  TABS.forEach((t, k)=>{
    if (k === 2 || k === 6) side.appendChild(h('div', { cls:'sep' }));
    const b = h('button', { cls:'nav' + (S.tab === t[0] ? ' on' : '') + (isDirty() && S.dirtyTab === t[0] ? ' dirty' : ''), title:t[1], on:{ click:()=> goTab(t[0]) } }, icon(t[2]), h('span', { cls:'t', text:t[1] }));
    if (t[0] === 'map' && onl) b.appendChild(h('span', { cls:'cnt', text:onl + ' on' }));
    side.appendChild(b);
  });
  side.appendChild(h('div', { cls:'me' }, h('b', null, h('span', { cls:'dot' }), S.name || 'Admin'), h('div', { cls:'dim small x', text:'door open · locks by itself after 8 hours' }),
    h('button', { cls:'sm', style:'margin-top:8px; width:100%', on:{ click:()=> leaveOk(lockNow) } }, icon('lock'), ' Lock')));
  const main = h('main', { cls:'main' });
  main.appendChild(h('div', { id:'msg', cls:'msg' + (S.bad ? ' bad' : '') + (S.msg ? '' : ' hide'), role:'status', text:S.msg }));
  const v = ({ home:tabHome, map:tabMap, players:tabPlayers, gifts:tabGifts, reports:tabReports, servers:tabServers, scores:tabScores, ads:tabAds, numbers:tabNumbers, words:tabWords, log:tabLog, me:tabMe }[S.tab] || tabHome)();
  if (S.tab === 'ads' || S.tab === 'numbers'){
    const mark = e=>{ const t = e.target; if (!t || t.type === 'search' || !t.closest) return; const sec = t.closest('[data-sec]'); if (sec) markDirty(sec.getAttribute('data-sec')); };
    v.addEventListener('input', mark); v.addEventListener('change', mark);
  }

  if (S.tab === 'map') lmStart();
}
/* the dashboard and the map keep themselves fresh */
setInterval(()=>{ if (S.view !== 'app' || document.hidden) return; if (S.tab === 'home' && !document.querySelector('.modal')) load('home'); else if (S.tab === 'map') lmRefresh(); }, 30000);

doorCheck().then(()=>{ if (S.tok) refreshMe(); });

:root{ --bg:#0d1016; --card:#161a23; --line:rgba(255,255,255,.12); --ink:#f1ece2; --dim:rgba(241,236,226,.62); --hot:#ff7a45; --teal:#5fd6c4; --bad:#ff5d5d; --ok:#7be08a; --yel:#ffd21f; color-scheme:dark; }
*{ box-sizing:border-box; }
html, body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

.tabs{ display:flex; gap:6px; flex-wrap:wrap; padding:10px 16px 0; }
.wrap{ max-width:1100px; margin:0 auto; padding:0 16px; }
button, input, select, textarea{ font:inherit; color:inherit; }
button{ min-height:40px; padding:0 14px; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.07); cursor:pointer; font-weight:700; }
button:hover{ background:rgba(255,255,255,.14); } button:active{ transform:scale(.97); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{ outline:3px solid var(--yel); outline-offset:2px; }
button.pri{ background:var(--hot); border-color:transparent; color:#1a0d06; } button.pri:hover{ background:#ff8f5f; }
button.bad{ border-color:rgba(255,93,93,.55); color:#ffb1b1; } button.sm{ min-height:34px; padding:0 10px; font-size:13px; }
button.tab{ border-radius:10px 10px 0 0; border-bottom-color:transparent; opacity:.7; } button.tab.on{ opacity:1; background:var(--card); border-color:var(--line); border-bottom-color:var(--card); color:var(--hot); }
button:disabled{ opacity:.45; cursor:default; }
input, select, textarea{ min-height:40px; padding:6px 10px; border-radius:10px; border:1px solid var(--line); background:#0b0d12; width:100%; }
input[type=checkbox]{ width:20px; min-height:20px; height:20px; padding:0; } input[type=color]{ padding:2px; width:54px; }
label{ display:block; font-size:13px; font-weight:700; color:var(--dim); margin:10px 0 4px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:12px 0; }
.center{ max-width:420px; margin:40px auto; }
.grid{ display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); }
.stat{ background:#0b0d12; border:1px solid var(--line); border-radius:12px; padding:12px; } .stat b{ display:block; font-size:26px; line-height:1.1; } .stat span{ font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
.row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .row > .grow{ flex:1 1 180px; min-width:0; }
.list{ display:flex; flex-direction:column; gap:8px; }
.item{ background:#0b0d12; border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
.item .hd{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; } .item .hd b{ font-size:16px; overflow-wrap:anywhere; }
.item .meta{ color:var(--dim); font-size:13px; overflow-wrap:anywhere; } .item .acts{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.tag{ display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; background:rgba(255,255,255,.1); }
.tag.bad{ background:rgba(255,93,93,.2); color:#ffb1b1; } .tag.ok{ background:rgba(123,224,138,.18); color:#b5f0bd; } .tag.hot{ background:rgba(255,122,69,.22); color:#ffc3a6; }
.msg{ margin:10px 0; padding:10px 12px; border-radius:10px; background:rgba(95,214,196,.12); border:1px solid rgba(95,214,196,.35); } .msg.bad{ background:rgba(255,93,93,.12); border-color:rgba(255,93,93,.4); }
.note{ margin:10px 0; padding:10px 12px; border-radius:10px; background:rgba(255,210,31,.08); border:1px solid rgba(255,210,31,.3); font-size:14px; }
.ad{ border-radius:10px; padding:14px 16px; min-height:92px; display:flex; flex-direction:column; justify-content:center; border:3px solid rgba(0,0,0,.35); }
.ad b{ font-size:24px; line-height:1.05; font-weight:900; letter-spacing:.01em; overflow-wrap:anywhere; } .ad span{ font-size:13px; font-weight:700; opacity:.92; overflow-wrap:anywhere; } .ad i{ display:block; width:46px; height:5px; margin:7px 0; }
.two{ display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); }
.cols3{ display:grid; gap:8px; grid-template-columns:repeat(3, minmax(0, 1fr)); }
table{ width:100%; border-collapse:collapse; } th, td{ text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:middle; } th{ color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
td input{ min-height:34px; } .num{ text-align:right; font-variant-numeric:tabular-nums; }
.modal{ position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(4,6,10,.75); }
.modal .card{ width:min(440px, 100%); margin:0; }
.hide{ display:none !important; }

/* ---------------------------------------------------------------- helpers: every piece of data is put on the page as TEXT, never as HTML */
function h(tag, at){
  const e = document.createElement(tag);
  if (at) for (const k in at){
    const v = at[k];
    if (v === undefined || v === null || v === false) continue;
    if (k === 'text') e.textContent = v; else if (k === 'on') { for (const ev in v) e.addEventListener(ev, v[ev]); }
    else if (k === 'cls') e.className = v; else if (k === 'style') e.style.cssText = v; else if (k === 'value') e.value = v; else if (k === 'checked') e.checked = !!v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (let i = 2; i < arguments.length; i++){ const c = arguments[i]; if (c === undefined || c === null || c === false) continue; if (Array.isArray(c)) c.forEach(x=> x && e.appendChild(x.nodeType ? x : document.createTextNode(String(x)))); else e.appendChild(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
const $ = id=> document.getElementById(id);
function ago(ms){ if (!ms) return 'never'; const s = Math.max(0, (Date.now() - ms)/1000); if (s < 90) return 'just now'; if (s < 3600) return Math.round(s/60) + ' min ago'; if (s < 172800) return Math.round(s/3600) + ' h ago'; return Math.round(s/86400) + ' days ago'; }
function when(ms){ try { return new Date(ms).toLocaleString(); } catch(e){ return ''; } }
function money(n){ return n === null || n === undefined ? '' : '$' + Math.round(Number(n) || 0).toLocaleString('en-US'); }
function errText(r){ return ERR[r && r.error] || ERR.net; }
function say(t, bad){ S.msg = t || ''; S.bad = !!bad; const m = $('msg'); if (m){ m.textContent = S.msg; m.className = 'msg' + (bad ? ' bad' : '') + (S.msg ? '' : ' hide'); if (S.msg) m.scrollIntoView({ block:'nearest' }); } }
async function rpc(fn, args){
  try {
    const r = await fetch(SUPA_URL + '/rest/v1/rpc/' + fn, { method:'POST', cache:'no-store', referrerPolicy:'no-referrer',
      headers:{ apikey:SUPA_KEY, Authorization:'Bearer ' + SUPA_KEY, 'Content-Type':'application/json' }, body:JSON.stringify(args || {}) });
    const d = await r.json().catch(()=> null);
    if (r.status === 404) return { ok:false, error:'off' };
    if (!r.ok) return { ok:false, error:'net' };
    return (d && typeof d === 'object') ? d : { ok:false, error:'net' };
  } catch(e){ return { ok:false, error:'net' }; }
}
async function call(fn, args){
  const r = await rpc('dl_admin_call', { p_token:S.tok, p_fn:fn, p_args:args || {} });
  if (r && r.error === 'not_admin'){ await refreshMe(); }
  return r;
}
/* a question before anything that changes something */
function ask(text, yesLabel, onYes, input){
  const inp = input ? h('input', { type:'text', maxlength:input.max || 120, placeholder:input.ph || '', value:input.value || '', autocomplete:'off' }) : null;
  const close = ()=> m.remove();
  const yes = h('button', { cls:'pri', text:yesLabel || 'Yes', on:{ click:()=>{ const v = inp ? inp.value.trim() : ''; close(); onYes(v); } } });
  const m = h('div', { cls:'modal', role:'dialog', 'aria-modal':'true' }, h('div', { cls:'card' }, h('p', { text:text }), input ? h('label', { text:input.label || '' }) : null, inp,
    h('div', { cls:'row', style:'margin-top:14px; justify-content:flex-end' }, h('button', { text:'Cancel', on:{ click:close } }), yes)));
  m.addEventListener('keydown', e=>{ if (e.key === 'Escape') close(); if (e.key === 'Enter' && inp){ yes.click(); } });
  document.body.appendChild(m); (inp || yes).focus();
}

/* ---------------------------------------------------------------- the door: ONE passcode. The game's database checks it (this page never
   holds the passcode or anything to compare it with); a right passcode gives an 8-hour key that lives in this tab only. */
function forget(){ S.tok = ''; S.name = ''; S.data = {}; try { sessionStorage.removeItem('dl_admin_tok'); } catch(e){} S.view = 'pass'; }
function waitText(sec){ sec = Math.max(1, Math.round(sec)); if (sec < 90) return sec + ' seconds'; if (sec < 5400) return Math.round(sec/60) + ' minutes'; return Math.round(sec/3600) + ' hours'; }
async function refreshMe(){
  if (!S.tok){ S.view = 'pass'; return draw(); }
  const r = await rpc('dl_admin_me', { p_token:S.tok });
  if (!r.ok && r.error !== 'auth'){ say(errText(r), true); return draw(); }
  if (!r.ok || !r.admin || !r.unlocked){ const was = S.view === 'app'; forget(); draw(); if (was) say(ERR.not_admin, true); return; }
  S.name = r.username || 'Admin'; S.view = 'app';
  draw(); load(S.tab);
}
async function unlock(code){
  say('Checking…');
  const r = await rpc('dl_admin_pass_unlock', { p_code:code });
  if (!r.ok){
    let t = errText(r);
    if (r.error === 'locked' && r.wait) t = 'Too many wrong tries. The door is locked for ' + waitText(r.wait) + '.';
    else if (r.error === 'bad_code' && r.wait) t += ' The door is locked now for ' + waitText(r.wait) + '.';
    else if (r.error === 'bad_code' && typeof r.left === 'number') t += ' ' + r.left + (r.left === 1 ? ' try' : ' tries') + ' left before it locks.';
    say(t, true); return;
  }
  S.tok = String(r.token || ''); try { sessionStorage.setItem('dl_admin_tok', S.tok); } catch(e){}
  say(''); await refreshMe();
}
async function lockNow(){
  const t = S.tok; forget(); say(''); draw(); doorCheck();
  if (t){ await rpc('dl_admin_lock', { p_token:t }); await rpc('dl_logout', { p_token:t }); }
}
/* before anybody types: is the admin site switched on, and is the door locked right now? */
async function doorCheck(){
  const r = await rpc('dl_admin_pass_state', {});
  if (S.view !== 'pass') return;
  if (!r.ok){ if (r.error === 'off') say(ERR.off, true); return; }
  if (!r.set) say(ERR.no_pass, true);
  else if (r.wait > 0) say('Too many wrong tries. The door is locked for ' + waitText(r.wait) + '.', true);
}

function passCard(){
  const o = h('input', { type:'password', maxlength:72, autocomplete:'off' }), n1 = h('input', { type:'password', maxlength:72, autocomplete:'new-password' }), n2 = h('input', { type:'password', maxlength:72, autocomplete:'new-password' });
  const go = async ()=>{
    if (n1.value.length < 5){ say('The new passcode needs at least 5 letters or numbers.', true); return; }
    if (n1.value !== n2.value){ say('The two new passcodes are not the same.', true); return; }
    const r = await rpc('dl_admin_pass_change', { p_token:S.tok, p_old:o.value, p_new:n1.value }); o.value = n1.value = n2.value = '';
    if (!r.ok){ if (r.error === 'not_admin' || r.error === 'auth') return refreshMe(); say(errText(r), true); return; }
    say('Passcode changed. Use the new one from now on.');
  };
  return h('div', { cls:'card' }, h('h3', { text:'Change the passcode', style:'margin-top:0' }),
    h('div', { cls:'cols3' }, h('div', null, h('label', { text:'Passcode now' }), o), h('div', null, h('label', { text:'New passcode' }), n1), h('div', null, h('label', { text:'New one again' }), n2)),
    h('div', { cls:'row', style:'margin-top:12px' }, h('button', { text:'Change it', on:{ click:go } })),
    h('p', { cls:'dim small', text:'Anyone who knows the passcode can use this site. Tell a parent what it is, and nobody else.' }));
}

const TABS = [['home', 'Home'], ['players', 'Players'], ['servers', 'Servers'], ['scores', 'Scores'], ['ads', 'Ads & news'], ['numbers', 'Game numbers'], ['words', 'Blocked words'], ['log', 'Log']];
async function load(tab){
  S.tab = tab; const D = S.data; let r;
  if (tab === 'home'){ r = await call('stats'); if (r.ok) D.stats = r; }
  else if (tab === 'players'){ r = await call('players', { q:D.q || '', limit:80 }); if (r.ok) D.players = r.players; }
  else if (tab === 'servers'){ r = await call('servers'); if (r.ok){ D.servers = r.servers; D.rooms = r.rooms; } }
  else if (tab === 'scores'){ r = await call('boards'); if (r.ok){ D.boards = r.boards; if (!D.board && r.boards.length) D.board = r.boards[0].board; }
    if (r.ok && D.board){ const s = await call('scores', { board:D.board, limit:100 }); if (s.ok) D.scores = s.scores; }
    const rr = await call('runs', { limit:40 }); if (rr.ok) D.runs = rr.runs; }
  else if (tab === 'ads' || tab === 'numbers'){ r = await call('config_get'); if (r.ok){ D.config = r.config; D.ads = D.news = D.prices = D.daily_pool = D.achievements = null; }
    const sg = await rpc('dl_site_get', {}); D.gameReads = !!sg.ok; }
  else if (tab === 'words'){ r = await call('words'); if (r.ok) D.words = r.words; }
  else if (tab === 'log'){ r = await call('log', { limit:120 }); if (r.ok) D.log = r.log; }
  if (r && !r.ok && r.error !== 'not_admin') say(errText(r), true);
  if (S.view === 'app') draw();
}
async function act(fn, args, done){
  const r = await call(fn, args);
  if (!r.ok){ say(errText(r), true); return r; }
  say(done || 'Done.'); await load(S.tab); return r;
}
